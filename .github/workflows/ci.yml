name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend, Streaming, Medallion & ML Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migration check
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci_test.db"
          SYNC_DATABASE_URL: "sqlite:///./data/ci_test.db"
        run: |
          mkdir -p data
          alembic upgrade head

      - name: Run automated test suite
        env:
          PYTHONPATH: "."
          APP_ENV: "testing"
        run: |
          pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build bundle
        working-directory: frontend
        run: npm run build

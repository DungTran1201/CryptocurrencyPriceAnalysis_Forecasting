name: CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend, Streaming, Medallion & ML Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify config profiles & Alembic migrations
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+aiosqlite:///./data/ci_test.db"
          SYNC_DATABASE_URL: "sqlite:///./data/ci_test.db"
        run: |
          mkdir -p data
          python -c "import os; from backend.app.core.config import Settings, PlatformProfile; [Settings.load() for p in PlatformProfile]"
          alembic upgrade head

      - name: Run unit, integration, and pipeline test suites
        env:
          PYTHONPATH: "."
          APP_ENV: "testing"
        run: |
          pytest tests/ -m "not system and not performance and not live" -v

  frontend-build:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

# Cryptocurrency Market Intelligence & Forecasting Configuration
app:
  name: "Binance Crypto Intelligence & Forecasting System"
  version: "2.0.0"
  env: "development"

data:
  symbols:
    - "BTCUSDT"
    - "ETHUSDT"
    - "SOLUSDT"
    - "BNBUSDT"
  time:
    default_frame: "1h"
    supported_frames:
      - "1m"
      - "5m"
      - "15m"
      - "1h"
      - "4h"
      - "1d"
  api:
    primary_url: "https://data-api.binance.vision/api/v3/klines"
    fallback_url: "https://api.binance.com/api/v3/klines"
    batch_limit: 1000
    max_retries: 5
    timeout_seconds: 15.0

ml:
  model_dir: "./data/models"
  default_horizon_steps: 6
  supported_horizons: [1, 3, 6, 12, 24]
  walk_forward_folds: 4
  activation_margin_threshold: 0.01
  min_direction_accuracy: 0.50
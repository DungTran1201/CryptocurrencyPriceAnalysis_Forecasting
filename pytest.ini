[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Fast pure-logic unit tests without filesystem, database, or broker I/O
    integration: Component integration tests using isolated temp DB/lake and in-memory broker
    pipeline: Medallion Lake, DuckDB Warehouse, and Workflow DAG tests in isolated tmp_path
    system: Multi-process or live/ephemeral NATS JetStream integration tests
    fault_injection: Adversarial failure, crash-recovery, and error-injection tests
    performance: Throughput, latency, and resource profiling benchmark tests
    live: Opt-in external Binance REST/WS connectivity tests (never run in default CI)
    slow: Long-running load, soak, or stress tests


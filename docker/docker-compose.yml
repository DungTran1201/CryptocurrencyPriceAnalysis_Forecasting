version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_forecaster_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: crypto_forecasting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_forecaster_backend
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/crypto_forecasting
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/crypto_forecasting
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - model_artifacts:/app/data/models
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: crypto_forecaster_worker
    command: ["python", "-m", "backend.app.workers.sync_worker", "300"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/crypto_forecasting
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/crypto_forecasting
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_artifacts:/app/data/models
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: crypto_forecaster_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  model_artifacts:
